name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ergon is pinned so a release cannot change what this gate checks between
# two runs of one commit. .ergon.yaml pins the tools that ergon installs.
env:
  ERGON_VERSION: v1.11.1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install ergon
        run: go install "go.thesmos.sh/ergon/cmd/ergon@${ERGON_VERSION}"
      - run: ergon bootstrap
      # The mutation stage runs gremlins, which starts each go test with flags
      # that keep its result cacheable. go test then passes the run a test
      # log, and no allocation ceiling is checked under it. -count=1 turns
      # the cache off for every go test of the gate.
      - run: ergon check
        env:
          GOFLAGS: -count=1
  # Vet, the build and the race tests run on every supported OS, because the
  # trees of files and the stores of properties read and write the file
  # system of the platform. The other jobs check properties of the source
  # that do not depend on the runner's OS, so they run on Linux only.
  vet-build:
    name: Vet + Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go install "go.thesmos.sh/ergon/cmd/ergon@${ERGON_VERSION}"
      - run: ergon lint vet
      - run: ergon build
  # The assertions run subjects, attempts and leak checks on goroutines of
  # their own, and the seats are shared between them, so every test also
  # runs under the race detector.
  test:
    name: Test (race, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go install "go.thesmos.sh/ergon/cmd/ergon@${ERGON_VERSION}"
      - run: ergon test race
  # Every fuzz target runs under the fuzzer for the time that .ergon.yaml
  # states: the parsers of patterns, tokens, store entries and typed
  # literals, and prop.Fuzz itself.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go install "go.thesmos.sh/ergon/cmd/ergon@${ERGON_VERSION}"
      - run: ergon test fuzz
  vuln:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go install "go.thesmos.sh/ergon/cmd/ergon@${ERGON_VERSION}"
      - run: ergon bootstrap
      - run: ergon lint vuln

  # The vendored definition is what this library is held to, and a copy
  # nobody checked is a copy that can drift. This fails on a copy that
  # does not match the manifest beside it, and reports without failing
  # when the definition has moved on: lagging is allowed, not knowing
  # is not.
  # The vendored definition is what this library is held to. A copy that
  # does not match the manifest beside it fails, always. A copy that
  # differs from upstream only fails when this change is the one that
  # touched it: falling behind is allowed and is tracked by an issue,
  # but committing a copy nobody else has is not.
  spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Did this change touch the vendored copy?
        id: touched
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null; then
            echo "strict=" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$base" HEAD -- conformance/spec | grep -q .; then
            echo "strict=--strict" >> "$GITHUB_OUTPUT"
          else
            echo "strict=" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the vendored definition
        run: ./tools/spec-check.sh conformance/spec ${{ steps.touched.outputs.strict }}
