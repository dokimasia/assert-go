# The copy of the definition of assert-spec, which spec sync writes and spec check verifies. The
# package conformance embeds the copy, and the package zone embeds its copy of the zone table.
implements:
  - definition: dokimasia/assert-spec
    path: conformance
    languages: [go]
    copies:
      - {from: spec/zones.json, to: internal/prop/zone/zones.json}
    test: [make, test-go]
