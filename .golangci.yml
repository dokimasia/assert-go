# golangci-lint configuration for assert-go.
#
# Reference: https://golangci-lint.run/usage/configuration/
#
# The set below is a conservative baseline — every linter named
# is a "no false-positive" check or a high-signal modernization
# rule. Extend as the project grows.

version: "2"

run:
  timeout: 5m
  modules-download-mode: readonly
  allow-parallel-runners: true
  tests: true

output:
  show-stats: true
  sort-order:
    - linter
    - severity
    - file

linters:
  default: none
  enable:
    # Correctness
    - copyloopvar
    - errcheck
    - errorlint
    - govet
    - nilerr
    - staticcheck
    - unused
    - wastedassign
    # Modernization
    - modernize
    - unparam
    # Style
    - dupl
    - dupword
    - gocritic
    - misspell
    - revive
    - usestdlibvars
    # Concurrency
    - asasalint
    - contextcheck
    - errname
    # Test hygiene
    - testpackage
    - thelper
    - tparallel
    - usetesting

  settings:
    gocritic:
      enabled-tags: [diagnostic]
      disabled-checks:
        - ifElseChain

    # Every test file declares the package x_test, export_test.go and
    # internal_test.go included: a test calls only what its package
    # exports. The pattern matches no file name, and an empty pattern
    # would match every one.
    testpackage:
      skip-regexp: "^$"

    revive:
      severity: warning
      rules:
        - name: context-as-argument
        - name: var-naming
        - name: package-comments
        - name: receiver-naming
        - name: error-return
        - name: error-naming
        - name: error-strings
        - name: errorf
        - name: if-return
        - name: indent-error-flow
        - name: early-return
        - name: unused-receiver

    govet:
      enable-all: true

  exclusions:
    generated: lax
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # fieldalignment is noise outside hot-path structs.
      - linters: [govet]
        text: "fieldalignment:"
      # A spec mirrors the exports of its source file. The testing
      # standard fixes the shape of its Test, Allocs and Benchmark
      # functions, so the specs of two similar source files repeat each
      # other, and so do the drivers of the twin surfaces.
      - linters: [dupl]
        path: _test\.go
      # The surfaces assert and expect are twins. go doc lists no method of
      # a type declared in an internal package, so each surface declares
      # its own functions, and the table of one surface's functions repeats
      # the other's names, one entry each.
      - linters: [dupl]
        path: ^conformance/functions\.go$

formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines

  settings:
    golines:
      max-len: 120
    gofumpt: {}
    # Match what `ergon fmt` writes, which puts this module's own
    # imports in a group of their own. Without this gci defaults to
    # two sections, and fmt and lint undo each other's work.
    gci:
      sections:
        - standard
        - default
        - prefix(go.dokimi.dev/assert)

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: false

severity:
  default: error
