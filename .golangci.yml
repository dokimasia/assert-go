# Managed by ergon init, with .ergon/local/.golangci.yml merged in. Change the repository's settings there and run ergon init sync.
#
# The configuration of golangci-lint for every module of the repository. It enables each linter
# that a Go repository of the baseline enables, with the strictest setting that one of them uses.
# A repository adds its own settings in its local file, which merges into this one: maps key by
# key, lists appended. The depguard rules of the repository's module boundaries go there.

version: "2"
run:
  timeout: 5m
  modules-download-mode: readonly
  allow-parallel-runners: true
  tests: true
  relative-path-mode: gomod
output:
  show-stats: true
  sort-order:
    - linter
    - severity
    - file
linters:
  default: none
  enable:
    # Correctness
    - copyloopvar
    - durationcheck
    - errcheck
    - errorlint
    - exhaustive
    - forcetypeassert
    - gosec
    - govet
    - ineffassign
    - makezero
    - nilerr
    - nilnil
    - predeclared
    - reassign
    - staticcheck
    - unconvert
    - unused
    - wastedassign
    # Modernization
    - modernize
    - unparam
    # Performance
    - bodyclose
    - gocritic
    - mirror
    - noctx
    - perfsprint
    - prealloc
    # Architecture and style
    - decorder
    - depguard
    - dupl
    - dupword
    - forbidigo
    - funcorder
    - goconst
    - interfacebloat
    - misspell
    - musttag
    - nolintlint
    - revive
    - sloglint
    - usestdlibvars
    - whitespace
    - wrapcheck
    # Concurrency
    - asasalint
    - containedctx
    - contextcheck
    - errname
    - fatcontext
    - spancheck
    # Test hygiene
    - paralleltest
    - testifylint
    - testpackage
    - thelper
    - tparallel
    - usetesting
  settings:
    asasalint:
      use-builtin-exclusions: true
    copyloopvar:
      check-alias: true
    decorder:
      disable-dec-order-check: true
      disable-init-func-first-check: false
    # depguard allows only the standard library in a module without rules, so this rule denies
    # the packages that the standard library or a successor replaces, and allows everything else.
    # A repository adds the rules of its module boundaries in its local file.
    depguard:
      rules:
        replaced:
          list-mode: lax
          files:
            - $all
          deny:
            - pkg: io/ioutil$
              desc: io/ioutil is deprecated, so use io and os
            - pkg: github.com/pkg/errors
              desc: wrap with fmt.Errorf and %w, and match with errors.Is and errors.As
            - pkg: golang.org/x/exp/slices$
              desc: use slices of the standard library
            - pkg: golang.org/x/exp/maps$
              desc: use maps of the standard library
            - pkg: golang.org/x/net/context$
              desc: use context of the standard library
            - pkg: github.com/golang/protobuf
              desc: github.com/golang/protobuf is deprecated, so use google.golang.org/protobuf
    exhaustive:
      default-signifies-exhaustive: true
      check:
        - switch
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^panic$
          msg: return an error instead of a panic
        - pattern: ^(fmt\.(Print|Printf|Println)|print|println)$
          msg: write to an io.Writer that the caller passes, or log through log/slog
    funcorder:
      constructor: true
      struct-method: true
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
      disabled-checks:
        - ifElseChain
    govet:
      enable-all: true
    interfacebloat:
      max: 10
    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false
    revive:
      severity: error
      confidence: 0.1
      rules:
        - name: blank-imports
        # thelper requires the test first in a helper, so a helper takes its context second.
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T"
        - name: early-return
        - name: empty-block
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: errorf
        - name: exported
        - name: if-return
        - name: indent-error-flow
        - name: modifies-value-receiver
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: redundant-import-alias
        - name: time-naming
        - name: unexported-return
        - name: unnecessary-stmt
        - name: unused-receiver
        - name: var-naming
    # revive checks the package comments and the names, so staticcheck runs every other check.
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
    # Every test file declares the package x_test, so a test calls only what its package exports.
    # The pattern matches no file name, and an empty pattern would match every one.
    testpackage:
      skip-regexp: "^$"
    usetesting:
      context-background: true
      context-todo: true
      os-setenv: true
      os-mkdir-temp: true
      os-temp-dir: true
    whitespace:
      multi-if: true
      multi-func: false
    # An error that the constructor of an error, a wrap, a join or a context returns already
    # carries its cause, and a walk of a file tree returns the error of the caller's own function,
    # so neither needs a second wrap.
    wrapcheck:
      ignore-sig-regexps:
        - \.New.*Error\(
        - \.(Wrap|Wrapf)\(
        - errors\.(Join|Unwrap)\(
        - \.Err\(
        - context\.Cause\(
        - (fs|filepath)\.WalkDir\(
        - filepath\.Walk\(
        - encoding/json\.Marshal\(
      # Each package of the module starts its errors with its own name and wraps the cause, so an
      # error that one package returns from another already carries its context.
      ignore-package-globs:
        - go.dokimi.dev/assert/*
  exclusions:
    generated: lax
    presets:
      - std-error-handling
      - common-false-positives
    paths:
      - (^|/)testdata($|/)
    rules:
      # A table or a fixture of a test exists once per test, so its layout and its size do not
      # matter.
      - path: _test\.go$
        linters: [govet]
        text: "fieldalignment:"
      - path: _test\.go$
        linters: [gocritic]
        text: "(hugeParam|rangeValCopy):"
      # A test states its values inline, because the value is the assertion.
      - path: _test\.go$
        linters: [goconst, gosec]
      # A failed type assertion or an unused parameter in a test fails the test, which is the
      # signal these linters exist for.
      - path: _test\.go$
        linters: [forcetypeassert, unparam]
      # A test file puts its fakes and helpers below the tests that use them, in reading order.
      - path: _test\.go$
        linters: [funcorder]
      # A fake of a test returns a nil value with a nil error on purpose, to prove the guard
      # against a broken value-or-error contract.
      - path: _test\.go$
        linters: [nilnil]
      # A spec mirrors its source file, so the specs of two similar files repeat each other.
      - path: _test\.go$
        linters: [dupl]
      # A test of an allocation ceiling, of an environment variable or of the test binary as a
      # process runs serially, and its name ends in Allocs, Env or Process.
      # testing.AllocsPerRun and t.Setenv panic in a parallel test, and two processes that exit
      # in the same nanosecond write one coverage file.
      - path: _test\.go$
        linters: [paralleltest, tparallel]
        text: 'Test\w*(Allocs|Env|Process)\b'
      # fieldalignment reports a struct that a field order makes larger, and a struct whose
      # pointers come after other fields. The second report saves no memory, and the order that it
      # asks for replaces the reading order of the fields, which the docblocks of the module follow.
      - linters: [govet]
        text: "fieldalignment: .* leading bytes of pointer data"
      # The property engine, its choices and the hashes convert between integer types by design: a
      # length to its unsigned count, a magnitude to its two's complement, and a bit pattern to its
      # float. A bound check at each conversion would restate a range that the code guarantees.
      - linters: [gosec]
        text: "G115:"
      # assert panics on a misuse of its API, such as an invalid option or a second registration of
      # a type, as its documentation states. A test has no caller that could handle an error.
      - linters: [forbidigo]
        text: "use of `panic` forbidden"
      # The exported functions and methods take their values as the public API states them, and
      # the values of the module, such as generators and specs, are immutable and passed by value
      # on purpose. A copy allocates nothing.
      - linters: [gocritic]
        text: "(hugeParam|rangeValCopy):"
      # The reflective decoders and the conformance drivers assert types that the decoder or the
      # vector's schema guarantees. A checked assertion would replace one panic with another.
      - path: \.go$
        linters: [forcetypeassert]
      # internal/matchertest states the cases of every assertion as tables that each surface's
      # tests run. A case states its values inline, as a test does, because the value is the case.
      - path: ^internal/matchertest/
        linters: [goconst]
      # The surfaces assert and expect are twins. go doc lists no method of a type declared in an
      # internal package, so each surface declares its own functions, and the table of one surface's
      # functions repeats the other's names, one entry each.
      - linters: [dupl]
        path: ^conformance/functions\.go$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
  # gci groups the standard library apart from every other import. A repository puts its own
  # modules in a group of their own by adding gci's sections in its local file, such as standard,
  # default and the prefix of its module paths.
  settings:
    gofumpt:
      extra:
        group-params: true
    golines:
      max-len: 120
    # The modules of the repository form an import group of their own.
    gci:
      sections:
        - standard
        - default
        - prefix(go.dokimi.dev/assert)
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
  fix: false
severity:
  default: error
