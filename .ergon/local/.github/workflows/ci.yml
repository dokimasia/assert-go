jobs:
  # The vendored definition is what this library is held to. A copy that does not match the
  # manifest beside it fails, always. A copy that differs from upstream fails only when this change
  # touched it: falling behind is allowed and an issue tracks it.
  spec:
    name: Spec
    needs: skip
    if: "needs.skip.outputs.skip != 'true'"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Find whether the change touched the vendored copy
        id: touched
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "strict=" >> "$GITHUB_OUTPUT"
          elif git diff --name-only "$BASE" HEAD -- conformance/spec | grep -q .; then
            echo "strict=--strict" >> "$GITHUB_OUTPUT"
          else
            echo "strict=" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the vendored definition
        env:
          STRICT: ${{ steps.touched.outputs.strict }}
        run: |
          ./tools/spec-check.sh conformance/spec $STRICT

  result:
    needs: [spec]
