jobs:
  # The vendored definition is what this library is held to. spec check fails for a copy that
  # differs from its manifest, and for a copy whose commit is not on the branch main of assert-spec.
  spec:
    name: Spec
    needs: skip
    if: "needs.skip.outputs.skip != 'true'"
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: stealth-scale/spec/.github/actions/setup-spec@78d70fd5be63102e43f8dd9628d4594914bb390e # v0.2.0
        with:
          version: v0.2.0
      - name: Check the vendored definition
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          spec check --remote

  result:
    needs: [spec]
